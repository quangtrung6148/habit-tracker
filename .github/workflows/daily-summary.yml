name: Daily summaries

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-summary-worker
  cancel-in-progress: false

jobs:
  summarize:
    if: ${{ vars.DAILY_SUMMARY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - run: npm run build --prefix worker
      - name: Generate every closed local day, with bounded batches
        run: node worker/dist/index.js --once
        env:
          NODE_ENV: production
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
